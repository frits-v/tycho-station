[package]
name = "tycho"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Tycho Station binary: Restate service endpoint, core supervision and the launchd watchdog"

[dependencies]
restate-sdk = { version = "=0.12.1", default-features = false, features = ["http_server"] }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
tycho-types = { path = "../tycho-types" }

[lints]
workspace = true

[package.metadata.dist]
dist = true
