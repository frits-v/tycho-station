[package]
name = "tycho"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Tycho Station binary: Restate service endpoint, core supervision and the launchd watchdog"

[dependencies]
restate-sdk = { version = "=0.12.1", default-features = false, features = ["http_server"] }
nix = { version = "=0.31.3", default-features = false, features = ["dir", "fs", "process", "signal", "socket", "term", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time"] }
sha2 = "=0.10.9"
nono = { version = "=0.80.0", default-features = false }
nono-proxy = { version = "=0.80.0", default-features = false }
zeroize = "=1.9.1"
tycho-types = { path = "../tycho-types" }

[dev-dependencies]
tycho-harness = { path = "../tycho-harness" }

[lints]
workspace = true

[package.metadata.dist]
dist = true
