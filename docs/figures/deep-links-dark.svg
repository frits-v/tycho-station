          <text x="33.25" y="122.72" xml:space="preserve" font-family="Inter" font-size="12" font-weight="400" fill="#E9EDF2">Chat tools strip custom URL schemes, so the notification carries a localhost link. The reader keeps the Ghostty terminal id it last opened for each session; it focuses that, or opens a tab running</text>
          <text x="33.25" y="140.12" xml:space="preserve" font-family="Inter" font-size="12" font-weight="400" fill="#E9EDF2">the attach.</text>
