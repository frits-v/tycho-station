<svg class="fig-light" role="img" aria-label="Escalation ladder: A question climbs from the worker to its control session, the parent control and the human, and each rung has a give-up rule." xmlns="http://www.w3.org/2000/svg" width="1000" height="521.7" viewBox="0 0 1000 521.7">
  <rect x="0" y="0" width="1000" height="521.7" fill="#FFFFFF"/>
  <defs>
    <marker id="escalation-light-arrow-clear-solid-3" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#066A5E"/></marker>
  </defs>
  <g data-id="" data-tag="Page">
    <g data-id="/body" data-tag="Body">
      <g data-id="/body/0" data-tag="Col">
        <g data-id="/body/0/children/0" data-tag="Row">
          <g data-id="/body/0/children/0/children/0" data-tag="Pcard">
            <rect x="20.5" y="20.5" width="323.67" height="81.9" rx="7.5" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1"/>
            <text x="31.5" y="58.48" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">Human</text>
            <text x="31.5" y="74.12" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5361">decision packet in; binding case out</text>
          </g>
          <g data-id="/body/0/children/0/children/1" data-tag="Col">
            <g data-id="/body/0/children/0/children/1/children/0" data-tag="Text">
              <rect x="377.29" y="20.63" width="602.08" height="81.65" rx="7.38" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1.25"/>
              <text x="389.92" y="45.78" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">GIVE-UP RULE TO REACH THIS RUNG</text>
              <text x="389.92" y="67.92" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">Council failed, or authority reserved to the human: spend, external commitments, data deletion, epic</text>
              <text x="389.92" y="85.32" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">scope, hook-marked human-only, or the ruling would overrule a human case.</text>
            </g>
          </g>
        </g>
        <g data-id="/body/0/children/1" data-tag="Row">
          <g data-id="/body/0/children/1/children/0" data-tag="Pcard">
            <rect x="20.5" y="143.4" width="323.67" height="60.3" rx="7.5" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1"/>
            <text x="31.5" y="170.58" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">Parent control, arbiter L2 .. root</text>
            <text x="31.5" y="186.22" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5361">same steps, wider scope</text>
          </g>
          <g data-id="/body/0/children/1/children/1" data-tag="Col">
            <g data-id="/body/0/children/1/children/1/children/0" data-tag="Text">
              <rect x="377.29" y="143.52" width="602.08" height="60.05" rx="7.38" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1.25"/>
              <text x="389.92" y="169.22" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">Council failed (no quorum, or an unrefuted blocking dissent), or the question crosses the work unit</text>
              <text x="389.92" y="186.62" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">boundary: other worktrees, shared interfaces, epic acceptance criteria, budget.</text>
            </g>
          </g>
        </g>
        <g data-id="/body/0/children/2" data-tag="Row">
          <g data-id="/body/0/children/2/children/0" data-tag="Pcard">
            <rect x="20.5" y="244.7" width="323.67" height="77.7" rx="7.5" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1"/>
            <text x="31.5" y="280.58" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">Control session, arbiter L1</text>
            <text x="31.5" y="296.22" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5361">rules alone or convenes a council</text>
          </g>
          <g data-id="/body/0/children/2/children/1" data-tag="Col">
            <g data-id="/body/0/children/2/children/1/children/0" data-tag="Text">
              <rect x="377.29" y="244.83" width="602.08" height="77.45" rx="7.38" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1.25"/>
              <text x="389.92" y="270.52" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">Blocker reproduced; at least two distinct attempts logged with outcomes; case law queried; question</text>
              <text x="389.92" y="287.92" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">typed with options. Immediate if outside worker authority: scope, interface, irreversible action,</text>
              <text x="389.92" y="305.32" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">security.</text>
            </g>
          </g>
        </g>
        <g data-id="/body/0/children/3" data-tag="Row">
          <g data-id="/body/0/children/3/children/0" data-tag="Pcard">
            <rect x="20.5" y="363.4" width="323.67" height="137.8" rx="7.5" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1"/>
            <text x="31.5" y="429.33" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">Worker</text>
            <text x="31.5" y="444.97" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5361">implements; may not rule</text>
          </g>
          <g data-id="/body/0/children/3/children/1" data-tag="Col">
            <g data-id="/body/0/children/3/children/1/children/0" data-tag="Text">
              <rect x="377.29" y="363.53" width="602.08" height="64.25" rx="7.38" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1.25"/>
              <text x="389.92" y="388.68" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1E24">AT EVERY ARBITER</text>
              <text x="389.92" y="410.82" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">1 empirical: probe   2 fresh binding precedent: cite   3 no council trigger: rule alone   4 else council</text>
            </g>
            <g data-id="/body/0/children/3/children/1/children/1" data-tag="Text">
              <rect x="377.29" y="441.03" width="602.08" height="60.05" rx="7.38" fill="#EEF2F0" stroke="#B9C3C0" stroke-width="1.25"/>
              <text x="389.92" y="466.72" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">An escalation with no proposed ruling is sent back down. Unpicked escalations move up after a</text>
              <text x="389.92" y="484.12" xml:space="preserve" font-family="Inter, 'Public Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1A1E24">timeout, with a cap.</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g data-id="/links/0" data-tag="Link" data-kind="solid-3">
    <path d="M 182.33 362.9 L 182.33 332.9" fill="none" stroke="#066A5E" stroke-width="2" stroke-linejoin="round"/>
    <line x1="182.33" y1="332.9" x2="182.33" y2="322.9" stroke="none" marker-end="url(#escalation-light-arrow-clear-solid-3)"/>
  </g>
  <g data-id="/links/1" data-tag="Link" data-kind="solid-3">
    <path d="M 182.33 244.2 L 182.33 214.2" fill="none" stroke="#066A5E" stroke-width="2" stroke-linejoin="round"/>
    <line x1="182.33" y1="214.2" x2="182.33" y2="204.2" stroke="none" marker-end="url(#escalation-light-arrow-clear-solid-3)"/>
  </g>
  <g data-id="/links/2" data-tag="Link" data-kind="solid-3">
    <path d="M 182.33 142.9 L 182.33 112.9" fill="none" stroke="#066A5E" stroke-width="2" stroke-linejoin="round"/>
    <line x1="182.33" y1="112.9" x2="182.33" y2="102.9" stroke="none" marker-end="url(#escalation-light-arrow-clear-solid-3)"/>
  </g>
</svg>
