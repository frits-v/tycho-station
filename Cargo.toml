[workspace]
resolver = "2"
members = ["crates/tycho", "crates/tycho-types", "crates/tycho-harness", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
