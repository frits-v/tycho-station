[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.10"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
libc = "=0.2.190"
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde_json = "1"
sha2 = "=0.10.9"
tycho-types = { path = "../crates/tycho-types" }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
aws-lc-rs = "=1.18.1"
pem = "=3.0.6"

[lints]
workspace = true
