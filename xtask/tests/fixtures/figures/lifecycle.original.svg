<svg viewBox="0 0 960 400" role="img" aria-label="Work unit state machine from queued through claimed, running, stalled, escalated, verifying, merging, merged and done">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong)"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--blocks)"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
  <g>
    <rect class="box" x="20" y="60" width="110" height="36" rx="18"/><text class="t b" x="48" y="83">queued</text>
    <rect class="box" x="180" y="60" width="110" height="36" rx="18"/><text class="t b" x="206" y="83">claimed</text>
    <rect class="box accent" x="340" y="60" width="110" height="36" rx="18"/><text class="t b" x="368" y="83">running</text>
    <rect class="box" x="340" y="180" width="110" height="36" rx="18"/><text class="t b" x="372" y="203">stalled</text>
    <rect class="box" x="520" y="180" width="120" height="36" rx="18"/><text class="t b" x="543" y="203">escalated</text>
    <rect class="box" x="180" y="300" width="130" height="36" rx="18"/><text class="t b" x="196" y="323">retry queued</text>
    <rect class="box" x="520" y="60" width="110" height="36" rx="18"/><text class="t b" x="545" y="83">verifying</text>
    <rect class="box" x="680" y="60" width="110" height="36" rx="18"/><text class="t b" x="700" y="83">fast-forward</text>
    <rect class="box" x="840" y="60" width="100" height="36" rx="18"/><text class="t b" x="865" y="83">merged</text>
    <rect class="box" x="840" y="180" width="100" height="36" rx="18"/><text class="t b" x="873" y="203">done</text>
    <rect class="box" x="680" y="300" width="130" height="36" rx="18"/><text class="t b" x="704" y="323">abandoned</text>
  </g>
  <path class="ln" marker-end="url(#ah)" d="M130 78 L180 78"/><text class="lbl" x="128" y="52">child claims lease</text>
  <path class="ln" marker-end="url(#ah)" d="M290 78 L340 78"/><text class="lbl" x="286" y="52">first status</text>
  <path class="ln" marker-end="url(#ah)" d="M450 78 L520 78"/><text class="lbl" x="440" y="52">result: done</text>
  <path class="ln" marker-end="url(#ah)" d="M630 78 L680 78"/><text class="lbl" x="606" y="52">fresh checkout, criteria pass</text>
  <path class="ln" marker-end="url(#ah)" d="M790 78 L840 78"/><text class="lbl" x="796" y="52">default advanced</text>
  <path class="ln" marker-end="url(#ah)" d="M890 96 L890 180"/><text class="lbl" x="898" y="140">prune, checkpoint</text>
  <path class="ln" marker-end="url(#ah)" d="M395 96 L395 180"/><text class="lbl" x="402" y="140">silence &gt; T1</text>
  <path class="ln acc" marker-end="url(#aha)" d="M380 180 L380 96"/><text class="lbl acc" x="300" y="150">nudge answered</text>
  <path class="ln" marker-end="url(#ah)" d="M450 78 C480 120 480 150 520 190"/><text class="lbl" x="470" y="130">give-up rule hit</text>
  <path class="ln acc" marker-end="url(#aha)" d="M520 198 C470 150 460 120 450 90"/><text class="lbl acc" x="455" y="170">verdict</text>
  <path class="ln bad" marker-end="url(#ahb)" d="M395 216 C330 260 300 280 280 300"/><text class="lbl bad" x="296" y="262">no progress &gt; T2: kill, attempt+1</text>
  <path class="ln" marker-end="url(#ah)" d="M200 300 C150 240 150 120 220 96"/><text class="lbl" x="60" y="230">backoff done</text>
  <path class="ln" marker-end="url(#ah)" d="M310 318 C420 318 480 250 540 216"/><text class="lbl" x="420" y="300">attempt &gt; max</text>
  <path class="ln" marker-end="url(#ah)" d="M600 216 C640 260 660 290 700 300"/><text class="lbl" x="620" y="262">verdict: abandon</text>
  <path class="ln bad" marker-end="url(#ahb)" d="M560 96 C560 130 480 140 450 110"/><text class="lbl bad" x="500" y="150">criteria fail: findings, attempt+1</text>
</svg>
