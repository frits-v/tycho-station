name: review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  review:
    name: review
    # A fork's pull request gets no OIDC token; drafts and the release pull request wait.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: read # checkout
      id-token: write # the OIDC token xtask review trades for an Anthropic access token
      pull-requests: write # post the review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/mbx
          key: ${{ runner.os }}-${{ runner.arch }}-mbx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mbx-
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.13
          cache: false
          install_args: rust mr-boxington claude
      # Built before the GitHub token is mapped; the build scripts of xtask's locked
      # dependencies run in this job, which can request OIDC tokens in every step.
      - run: cargo build --locked -p xtask
      - run: target/debug/xtask review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
