too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-methods = [
    { path = "std::fs::remove_dir_all", reason = "follows symlinked ancestors; remove under an agent-writable root with agent_tree::remove_dir" },
    { path = "std::fs::create_dir_all", reason = "follows symlinked ancestors; create under an agent-writable root with agent_tree::ensure_dirs" },
    { path = "std::fs::canonicalize", reason = "a resolved path is for comparison only, never an operation target" },
    { path = "std::env::remove_var", reason = "not thread-safe and unsafe from edition 2024; only the startup steps in xtask main change the environment" },
    { path = "std::env::set_var", reason = "not thread-safe and unsafe from edition 2024; set a variable on the child's Command instead" },
]
