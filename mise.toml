min_version = "2026.9.2"

[tools]
# mr_boxington runs cargo through mbx, the shared compiler-output cache (mise 2026.9.2+).
rust = { version = "1.94", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.23.0"
lefthook = "2.2.0"
zizmor = "1.30.1"
"github:jdx/jactionlint" = "2.0.2"
opengrep = "1.30.2"
shellcheck = "0.11.0"
restate = "1.7.13"
restate-server = "1.7.13"
zmx = "0.8.1"
cue = "0.17.1"
entire = "0.11.4"
claude = "2.1.280"
codex = "0.160.1"
release-plz = "0.3.170"
cargo-dist = "0.33.0"
gh = "2.102.0"
"cargo:https://github.com/frits-v/stencil" = { version = "rev:bd567cfc6127f526bef4ccd70215ea11ee4518cb", crate = "stencil-cli", bin = "stencil", locked = true }

[tasks.ci]
description = "Every check ci runs; in GitHub Actions, then the SARIF upload to code scanning"
run = "cargo run -q -p xtask -- ci"

[tasks.opengrep]
description = "Test the opengrep rules against their fixtures, then scan the repository with them"
run = "cargo run -q -p xtask -- opengrep"

[tasks.workflows]
description = "Audit the GitHub workflows with zizmor and jactionlint at pedantic"
run = "cargo run -q -p xtask -- workflows"

[tasks.cache-trim]
description = "Collect the mbx store down to the size CI saves"
run = "mbx gc --max-size 3GiB"

[tasks.render-figures]
description = "Render figures/ with cue and stencil into docs/figures and the design page"
run = "cargo run -q -p xtask -- render-figures"

[tasks.config-export]
description = "Vet the CUE configuration and schemas, then write config/export"
run = "cargo run -q -p xtask -- config-export"

[tasks.check-commit]
description = "Check one commit message file against the conventional commit grammar"
run = "cargo run -q -p xtask -- check-commit-msg"

[tasks.hooks]
description = "Install the git hooks"
run = "lefthook install"

[tasks.kill-tests]
description = "Kill the restate server, the endpoint and the watchdog in turn and watch each return (macOS)"
run = "cargo test -p tycho --test kill -- --ignored --test-threads=1 --nocapture"

[tasks.graph-plugin]
description = "Install the entire semantic graph plugin at the pinned version"
run = "entire plugin install graph --pin v0.4.0 --yes"

[tasks.graph-tests]
description = "Build, rebuild and query the semantic graph index of a copy of this repository and record the index build time; needs `mise run graph-plugin` first"
run = "cargo test -p tycho --test graph -- --ignored --test-threads=1 --nocapture"

[tasks.release-pr]
description = "Open or update the release pull request; --dry-run shows it locally"
run = "cargo run -q -p xtask -- release-pr"

[tasks.release]
description = "Tag a merged release pull request and create its GitHub release"
run = "cargo run -q -p xtask -- release"

[tasks.release-binaries]
description = "Build this host's tycho archives with dist and upload them to the release"
run = "cargo run -q -p xtask -- release-binaries"

[tasks.review]
description = "Claude reviews this branch against origin/main and prints the findings; posts nothing"
run = "cargo run -q -p xtask -- review --dry-run"

[tasks.spine-tests]
description = "Drive the spine services through a real core with a test-double endpoint beside the production one (macOS)"
run = "cargo test -p tycho --test spine -- --ignored --test-threads=1 --nocapture"

[tasks.launcher-tests]
description = "Spawn launchers under zmx against a throwaway core, then kill the launcher and the restate server at the named moments (macOS)"
run = "cargo test -p tycho --test launcher -- --ignored --test-threads=1 --nocapture"

[tasks.worker-tests]
description = "Dispatch the synthetic epic's trivial unit to a real headless claude worker through a throwaway core; needs a Claude login and `mise run graph-plugin` first; run it alone, never beside the control suite, since both use the vendor seat (macOS)"
run = "cargo test -p tycho --test worker -- --ignored --test-threads=1 --nocapture"

[tasks.control-tests]
description = "Spawn real interactive claude control sessions under zmx through the launcher, instruct them over the inbox socket from a handler step, then stall, kill and resume them; run it alone, never beside the worker suite, since both use the vendor seat (macOS, uses the developer's claude login)"
run = "cargo test -p tycho --test control -- --ignored --test-threads=1 --nocapture"

[tasks.chaos-tests]
description = "Run a work unit through the operator while the terminal app, the restate server, the endpoint and the launcher are killed; record the slice zero baselines (macOS)"
run = "cargo test -p tycho --test chaos -- --ignored --test-threads=1 --nocapture"

[tasks.boundary-tests]
description = "Probe the developer's home and credentials, the agent's settings file, a test core's admin port and its canonical repository as the agent user, then run the merge gate's verify, fast-forward and sync to a throwaway remote; run from a terminal, since sudo asks for the developer's password to become the agent (macOS)"
run = "cargo test -p tycho --test boundary -- --ignored --test-threads=1 --nocapture"

[tasks.setup]
description = "Check the operator preconditions for running the factory on this machine"
run = "cargo run -q -p xtask -- setup"

[tasks.provision-agent]
description = "Create the agent user, its group, the shared group and the socket directories, asking for sudo per step; --print shows the plan and runs nothing"
run = "cargo run -q -p xtask -- provision-agent"
