[tools]
rust = "1.94"
lefthook = "2.2.0"

[tasks.ci]
description = "Format check, lints, tests, and the pull request title check when run in CI"
run = "cargo run -q -p xtask -- ci"

[tasks.check-commit]
description = "Check one commit message file against the conventional commit grammar"
run = "cargo run -q -p xtask -- check-commit-msg"

[tasks.hooks]
description = "Install the git hooks"
run = "lefthook install"
