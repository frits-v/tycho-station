rules:
  - id: rust-todo-without-ticket
    message: >-
      TODO without a ticket reference. Name a ticket key (ABC-123) or link the ticket, so the
      comment has an owner.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-regex: '(?://[/!]?|/\*[*!]?)\s*TODO(?!\s*[:(]?\s*(?:[A-Z]+-[0-9]+|https?://))'

  - id: rust-history-trace-comment
    message: >-
      History-trace comment. A comment describes the end state and why, not the path that
      led here; provenance lives in commit messages and the ledger.
    languages: [rust]
    severity: ERROR
    patterns:
      # The lookbehinds exempt the instrumental "is/are/was used to", which says what a
      # thing is for rather than what it once did.
      - pattern-regex: '(?i)//[^\n]*\b(?:previously|(?<!\bis\s)(?<!\bare\s)(?<!\bwas\s)(?<!\bwere\s)(?<!\bbe\s)(?<!\bbeen\s)(?<!\bbeing\s)used\s+to|now\s+does|was\s+\w+\s+before(?!\s+\w)|this\s+replaces|we\s+changed|removed\s+the|an\s+earlier\s+version|first\s+two\s+versions)\b'

  - id: rust-cargo-build-bypasses-mbx
    message: >-
      A cargo started from Rust finds rustup's cargo on PATH, not the mise wrapper, so the
      build skips the mbx cache. Start `mbx` with the same subcommand instead.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: Command::new("cargo").args([$SUBCOMMAND, ...])
          - pattern: Command::new("cargo").args(&[$SUBCOMMAND, ...])
          - pattern: Command::new("cargo").arg($SUBCOMMAND)
          - pattern: Command::new("cargo").$SETUP(...).args([$SUBCOMMAND, ...])
          - pattern: Command::new("cargo").$SETUP(...).args(&[$SUBCOMMAND, ...])
          - pattern: Command::new("cargo").$SETUP(...).arg($SUBCOMMAND)
          - patterns:
              - pattern-inside: |
                  let mut $COMMAND = Command::new("cargo");
                  ...
              - pattern-either:
                  - pattern: $COMMAND.arg($SUBCOMMAND)
                  - pattern: $COMMAND.args([$SUBCOMMAND, ...])
                  - pattern: $COMMAND.args(&[$SUBCOMMAND, ...])
          - pattern: $RUNNER("cargo", &[$SUBCOMMAND, ...])
      - metavariable-regex:
          metavariable: $SUBCOMMAND
          regex: '^"(bench|build|check|clippy|doc|install|run|rustc|test)"$'

  - id: rust-git-inherits-hook-environment
    message: >-
      A git child inherits GIT_DIR and the rest of a hook's environment and acts on the
      repository that ran the hook. Start git through
      `tycho_types::git_environment::git_command`, or a runner given
      `&git_environment_removed()`, or clear the environment.
    languages: [rust]
    severity: ERROR
    paths:
      exclude:
        - "crates/tycho-types/src/git_environment.rs"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Command::new("git")
              - pattern: std::process::Command::new("git")
              - pattern: Command::new(&$HOLDER.git)
              - pattern: Command::new($HOLDER.git)
          - pattern-not-inside: Command::new($PROGRAM).env_clear()
          - pattern-not-inside: |
              let mut $COMMAND = Command::new($PROGRAM);
              $COMMAND.env_clear();
              ...
      # The bounded runners in `crates/tycho/src/command.rs`, given git by literal path,
      # by a name `git` or `GIT`, by a field named `git`, or by a variable bound to a git
      # path. metavariable-regex anchors at the start. `run_status_capped`,
      # `run_captured_without` and `run_detached` take a removal list, and a call passing
      # the git one is exempt; `run_status_from` takes none, so git through it is refused.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $RUNNER($PROGRAM, ...)
                  - metavariable-regex:
                      metavariable: $PROGRAM
                      regex: '.*(?:"(?:[^"]*/)?git"|\bgit\b|\bGIT\b)'
              - patterns:
                  - pattern-inside: |
                      let $BINDING = $INITIAL;
                      ...
                  - pattern: $RUNNER($BINDING, ...)
                  - metavariable-regex:
                      metavariable: $INITIAL
                      regex: '.*"(?:[^"]*/)?git"'
          - metavariable-regex:
              metavariable: $RUNNER
              regex: '^(?:\w+(?:::|\s+))*run_(?:captured|status|detached)\w*$'
          - pattern-not: $RUNNER($ANY, $WORDS, $PAIRS, &git_environment_removed(), ...)

  - id: rust-secret-variable-read-outside-the-store
    message: >-
      A secret variable is read from the environment outside `xtask/src/secrets.rs`, which
      takes every secret out of the process environment before any child starts. Read it
      with `secrets::read` and list it in `SECRET_VARIABLES`. The job tokens `GITHUB_TOKEN`
      and `GH_TOKEN` are exempt: gh and release-plz read them from their own environment.
    languages: [rust]
    severity: ERROR
    paths:
      exclude:
        - "xtask/src/secrets.rs"
        - "crates/**"
    patterns:
      - pattern-either:
          - pattern: env::var($NAME)
          - pattern: std::env::var($NAME)
          - pattern: env::var_os($NAME)
          - pattern: std::env::var_os($NAME)
      # The name's last path segment, or the literal, names a key, secret or token; a public
      # key and the job tokens are not secrets the store holds.
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(?:[\w.]*(?:::|\.))?(?!\w*public)(?!"?(?:GITHUB_TOKEN|GH_TOKEN)"?$)[\w"]*(?:secret|token|key)[\w"]*$'

  - id: rust-secret-printed
    message: >-
      A secret's exposed value is written to output. Print what the secret is for, never its
      value; output reaches job logs, step summaries and terminals.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-inside: println!(...)
          - pattern-inside: eprintln!(...)
          - pattern-inside: print!(...)
          - pattern-inside: eprint!(...)
          - pattern-inside: writeln!(...)
          - pattern-inside: write!(...)
      - pattern-regex: '\.expose\(\)'

  - id: rust-secret-copied-out-of-its-type
    message: >-
      A secret's exposed value is copied into a plain `String`, which prints, logs and
      serializes like any other. Keep it in its own type and borrow it with `expose()` where
      it is sent.
    languages: [rust]
    severity: ERROR
    paths:
      exclude:
        - "crates/**"
    pattern-either:
      - pattern: $SECRET.expose().to_string()
      - pattern: $SECRET.expose().to_owned()
      - pattern: String::from($SECRET.expose())
      - patterns:
          - pattern-inside: format!(...)
          - pattern-regex: '\.expose\(\)'

  - id: rust-pull-request-ref
    message: >-
      A pull request is named by a `refs/pull/` reference, which its author can move after a
      check. Fetch the pull request by the commit the run resolved, and post on that commit.
    languages: [rust]
    severity: ERROR
    pattern-regex: '"refs/pull/[^"]'
